name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run lint && npm run build
        working-directory: frontend

  postgres-regressions:
    name: isolated PostgreSQL regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bagipangan_test
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bagipangan_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BAGIPANGAN_FOOD_TEST_DATABASE_URL: postgres://bagipangan_test:local-test-only@127.0.0.1:55432/bagipangan_food_test?sslmode=disable
      BAGIPANGAN_CLAIM_TEST_DATABASE_URL: postgres://bagipangan_test:local-test-only@127.0.0.1:55432/bagipangan_claim_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: zero-hunger-food-service/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Create disposable databases
        env:
          PGPASSWORD: local-test-only
        run: |
          psql -h 127.0.0.1 -p 55432 -U bagipangan_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bagipangan_food_test'
          psql -h 127.0.0.1 -p 55432 -U bagipangan_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bagipangan_claim_test'
      - run: go test -race ./internal/repository/db -run Postgres -v -count=1 -timeout=90s
        working-directory: zero-hunger-food-service
      - run: go test -race ./internal/repository/db -run Postgres -v -count=1 -timeout=90s
        working-directory: zero-hunger-claim-service

  test:
    name: vet + test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - zero-hunger-contracts
          - zero-hunger-user-service
          - zero-hunger-request-service
          - zero-hunger-food-service
          - zero-hunger-claim-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: go vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ matrix.service }}
        run: go test ./...

  build:
    name: config + images
    runs-on: ubuntu-latest
    needs: test
    env:
      CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder-not-a-real-token
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env for compose
        working-directory: zero-hunger-infra
        run: cp .env.example .env

      - name: Validate docker-compose
        working-directory: zero-hunger-infra
        run: docker compose config -q

      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/zero-hunger-infra/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build images
        working-directory: zero-hunger-infra
        run: docker compose build
