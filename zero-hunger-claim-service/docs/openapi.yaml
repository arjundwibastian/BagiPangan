openapi: 3.0.3
info: { title: Zero Hunger Claim Service, version: 1.0.0 }
servers: [{ url: http://localhost:8084 }]
paths:
  /api/v1/claims:
    post:
      summary: Claim food
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateClaim' } } } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/claims/{claim_id}:
    get: { summary: Get claim, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /api/v1/claims/{claim_id}/verify-pickup:
    post:
      summary: Verify pickup code
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [claim_code], properties: { claim_code: { type: string, minLength: 1, maxLength: 10 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/claims/{claim_id}/cancel:
    post: { summary: Cancel claim, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Success' } } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  schemas:
    CreateClaim:
      type: object
      required: [request_id, food_listing_id, claimed_quantity]
      properties:
        request_id: { type: string, format: uuid }
        food_listing_id: { type: string, format: uuid }
        claimed_quantity: { type: integer, minimum: 1 }
  responses: { Success: { description: Envelope response }, Error: { description: Error envelope } }
