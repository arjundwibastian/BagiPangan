services:
  user-service:
    build:
      context: ..
      dockerfile: zero-hunger-user-service/Dockerfile
    image: zero-hunger/user-service:local
    environment:
      SERVER_PORT: "8081"
      PORT: "8081"
      GRPC_PORT: "50051"
      DATABASE_URL: ${USER_DATABASE_URL:?set USER_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ACCESS_TTL: 1h
      JWT_REFRESH_TTL: 168h
    ports:
      - "8081:8081"
    expose:
      - "50051"

  request-service:
    build:
      context: ..
      dockerfile: zero-hunger-request-service/Dockerfile
    image: zero-hunger/request-service:local
    environment:
      SERVER_PORT: "8083"
      PORT: "8083"
      GRPC_PORT: "50053"
      DATABASE_URL: ${REQUEST_DATABASE_URL:?set REQUEST_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      REQUEST_TTL: 24h
      USER_SERVICE_GRPC_ADDRESS: user-service:50051
      FOOD_SERVICE_GRPC_ADDRESS: food-service:50052
    ports:
      - "8083:8083"
    expose:
      - "50053"
    depends_on:
      - user-service

  food-service:
    build:
      context: ..
      dockerfile: zero-hunger-food-service/Dockerfile
    image: zero-hunger/food-service:local
    environment:
      PORT: "8082"
      SERVER_PORT: "8082"
      GRPC_PORT: "50052"
      DB_HOST: ${FOOD_DB_HOST:?set FOOD_DB_HOST}
      DB_PORT: ${FOOD_DB_PORT:?set FOOD_DB_PORT}
      DB_USER: ${FOOD_DB_USER:?set FOOD_DB_USER}
      DB_PASSWORD: ${FOOD_DB_PASSWORD:?set FOOD_DB_PASSWORD}
      DB_NAME: ${FOOD_DB_NAME:?set FOOD_DB_NAME}
      DB_SSLMODE: ${FOOD_DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${FOOD_DB_SSLROOTCERT:-}
      USER_SERVICE_GRPC_ADDRESS: user-service:50051
      REQUEST_SERVICE_GRPC_ADDRESS: request-service:50053
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    ports:
      - "8082:8082"
    expose:
      - "50052"
    # Drop your CA at zero-hunger-infra/certs/ and set FOOD_DB_SSLROOTCERT
    # (e.g. /certs/prod-ca-2021.crt) when FOOD_DB_SSLMODE is verify-ca/verify-full.
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - user-service
      - request-service

  claim-service:
    build:
      context: ..
      dockerfile: zero-hunger-claim-service/Dockerfile
    image: zero-hunger/claim-service:local
    environment:
      PORT: "8084"
      SERVER_PORT: "8084"
      GRPC_PORT: "50054"
      DB_HOST: ${CLAIM_DB_HOST:?set CLAIM_DB_HOST}
      DB_PORT: ${CLAIM_DB_PORT:?set CLAIM_DB_PORT}
      DB_USER: ${CLAIM_DB_USER:?set CLAIM_DB_USER}
      DB_PASSWORD: ${CLAIM_DB_PASSWORD:?set CLAIM_DB_PASSWORD}
      DB_NAME: ${CLAIM_DB_NAME:?set CLAIM_DB_NAME}
      DB_SSLMODE: ${CLAIM_DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${CLAIM_DB_SSLROOTCERT:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      USER_SERVICE_GRPC_ADDRESS: user-service:50051
      FOOD_SERVICE_GRPC_ADDRESS: food-service:50052
      REQUEST_SERVICE_GRPC_ADDRESS: request-service:50053
    ports:
      - "8084:8084"
    expose:
      - "50054"
    # Drop your CA at zero-hunger-infra/certs/ and set CLAIM_DB_SSLROOTCERT
    # (e.g. /certs/prod-ca-2021.crt) when CLAIM_DB_SSLMODE is verify-ca/verify-full.
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - user-service
      - request-service
      - food-service
