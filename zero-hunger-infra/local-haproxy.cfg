# Disposable local-stack TCP forwarding; no production routes or credentials.
global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 120s
    timeout server 120s

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

listen users
    bind :8081
    server users user-service:8081 check resolvers docker init-addr last,libc,none

listen food
    bind :8082
    server food food-service:8082 check resolvers docker init-addr last,libc,none

listen requests
    bind :8083
    server requests request-service:8083 check resolvers docker init-addr last,libc,none

listen claims
    bind :8084
    server claims claim-service:8084 check resolvers docker init-addr last,libc,none

listen postgres
    bind :55432
    server postgres postgres:5432 check resolvers docker init-addr last,libc,none
