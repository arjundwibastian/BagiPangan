syntax = "proto3";

package claim.v1;

option go_package = "github.com/zero-hunger/contracts/gen/claim/v1;claimv1";

import "google/protobuf/timestamp.proto";

service ClaimService {
  rpc GetClaim(GetClaimRequest) returns (GetClaimResponse);
  rpc VerifyPickupCode(VerifyPickupCodeRequest) returns (VerifyPickupCodeResponse);
  rpc CancelClaim(CancelClaimRequest) returns (CancelClaimResponse);
}

enum ClaimStatus {
  CLAIM_STATUS_UNSPECIFIED = 0;
  CLAIM_STATUS_WAITING_FOR_PICKUP = 1;
  CLAIM_STATUS_PICKED_UP = 2;
  CLAIM_STATUS_CANCELLED = 3;
}

message Claim {
  string claim_id = 1;
  string request_id = 2;
  string food_listing_id = 3;
  int32 claimed_quantity = 4;
  google.protobuf.Timestamp code_expires_at = 5;
  google.protobuf.Timestamp claimed_at = 6;
  ClaimStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GetClaimRequest { string claim_id = 1; }
message GetClaimResponse { Claim claim = 1; }

message VerifyPickupCodeRequest { string claim_id = 1; string claim_code = 2; }
message VerifyPickupCodeResponse { Claim claim = 1; bool verified = 2; }

message CancelClaimRequest { string claim_id = 1; }
message CancelClaimResponse { Claim claim = 1; }
