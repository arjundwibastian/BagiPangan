syntax = "proto3";

package user.v1;

option go_package = "github.com/zero-hunger/contracts/gen/user/v1;userv1";

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_ADMIN = 1;
  USER_ROLE_RECIPIENT = 2;
  USER_ROLE_DONOR = 3;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest { string user_id = 1; }
message GetUserResponse {
  string user_id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  UserRole role = 5;
}
