syntax = "proto3";

package common.v1;

option go_package = "github.com/zero-hunger/contracts/gen/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

message GeoPoint {
  double latitude = 1;
  double longitude = 2;
}

message PageRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message PageResponse {
  int32 page = 1;
  int32 page_size = 2;
  int64 total = 3;
}

message TimeRange {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp until = 2;
}
